<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Birthday Royale</title>

    <link rel="stylesheet" href="games.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600;800&display=swap"
          rel="stylesheet">

</head>

<body>

    <div class="arena" id="arena">

        <div id="battleText">

            ⚔️ BATTLE IN PROGRESS ⚔️

        </div>

        <div id="overlay"></div>

        <div id="spotlight"></div>

        <!-- KING -->

        <img id="king"
             src="assets/battle/king_stop.png">

        <div id="speech">

            STOP! STOP THE BATTLE!

        </div>

        <!-- BALLOON GOBLINS -->

        <img class="balloon goblin1"
             src="assets/battle/goblin_balloon.png">

        <img class="balloon goblin2"
             src="assets/battle/goblin_balloon.png">

        <img class="balloon goblin3"
             src="assets/battle/goblin_balloon.png">

        <!-- CONFETTI GOBLINS -->

        <img class="confetti confetti1"
             src="assets/battle/goblin_confetti.png">

        <img class="confetti confetti2"
             src="assets/battle/goblin_confetti.png">

        <img class="confetti confetti3"
             src="assets/battle/goblin_confetti.png">

        <img class="confetti confetti4"
             src="assets/battle/goblin_confetti.png">

        <!-- CAKE GOBLIN -->

        <img id="cakeGoblin"
             src="assets/battle/goblin_cake.png">

    </div>

    <!-- AUDIO -->

    <audio id="fanfare"
           src="assets/battle/announcement_fanfare.mp3.mpeg"></audio>

    <audio id="kingVoice"
           src="assets/battle/king_announcement.mp3.mpeg"></audio>

    <audio id="run1"
           src="assets/battle/cartoon_running.mp3.mpeg"></audio>

    <audio id="run2"
           src="assets/battle/cartoon_running2.mp3.mpeg"></audio>

    <audio id="footsteps"
           src="assets/battle/cartoon_footsteps.mp3.mpeg"></audio>

    <audio id="giggle"
           src="assets/battle/goblin_giggle.wav"></audio>

    <audio id="cheer"
           src="assets/battle/yay_cheering.mp3.mpeg"></audio>

    <script src="games.js"></script>

</body>

</html>
