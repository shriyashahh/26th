<!DOCTYPE html>

<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
        content="width=device-width, initial-scale=1.0">

    <title>Birthday Royale</title>

    <link rel="stylesheet" href="games.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;600&display=swap"
        rel="stylesheet">

</head>

<body>

    <div class="arena">

        <div id="battleText">

            ⚔️ BATTLE IN PROGRESS ⚔️

        </div>

        <div id="overlay"></div>

        <img id="king"
            src="assets/battle/king_stop.png">

        <img id="balloonGoblin"
            src="assets/battle/goblin_balloon.png">

        <div id="speech">

            STOP! STOP THE BATTLE!

        </div>

        <div id="goblinBubble">

            Birthday supplies incoming!! 🎈

        </div>

    </div>

    <audio id="fanfare"
        src="assets/battle/announcement_fanfare.mp3.mpeg"></audio>

    <audio id="kingVoice"
        src="assets/battle/king_announcement.mp3.mpeg"></audio>

    <audio id="footsteps"
        src="assets/battle/cartoon_running.mp3.mpeg"></audio>

    <script src="games.js"></script>

</body>

</html>
