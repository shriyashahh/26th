<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Midnight Archives</title>

    <link rel="stylesheet" href="music.css">

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&display=swap"
          rel="stylesheet">

</head>

<body>

    <div class="phone">

        <div class="top-bar">

            <button onclick="goBack()">←</button>

            <h2>Midnight Archives</h2>

        </div>

        <img src="assets/music/cover.jpg" class="cover">

        <p class="subtitle">
            Songs that accidentally became memories.
        </p>

        <div class="playlist">

            <div class="song" onclick="playSong(0)">
                <span>▶</span>
                <p>Raw version hits different 🥹</p>
            </div>

            <div class="song" onclick="playSong(1)">
                <span>▶</span>
                <p>Premium access unlocked 🪪</p>
            </div>

            <div class="song" onclick="playSong(2)">
                <span>▶</span>
                <p>Unexpected rang in my zindagi 💛</p>
            </div>

            <div class="song" onclick="playSong(3)">
                <span>▶</span>
                <p>That silent part >>> 🫂</p>
            </div>

            <div class="song" onclick="playSong(4)">
                <span>▶</span>
                <p>Long drive soundtrack 🤌🏻</p>
            </div>

            <div class="song" onclick="playSong(5)">
                <span>▶</span>
                <p>Certified goosebumps generator ⚡</p>
            </div>

        </div>

        <audio id="player" controls></audio>

    </div>

    <script src="music.js"></script>

</body>

</html>
